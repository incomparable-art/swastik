  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.4);
      --text-color: #1e293b;
    }

    body1 {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #a855f7, transparent 40%),
      radial-gradient(circle at bottom right, #6366f1, transparent 40%),
      #0f172a;
    }

    /* Trigger Button */
    .btn-trigger {
      padding: 16px 32px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: var(--primary-gradient);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      transition: all 0.3s ease;
    }

    .btn-trigger:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px -5px rgba(168, 85, 247, 0.6);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;

      /* FIX: High z-index keeps the overlay ABOVE table buttons */
      z-index: 9999;

      /* Background tint & Blur */
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); /* Safari support */

      /* Centering */
      display: flex;
      align-items: center;
      justify-content: center;

      /* Centering */
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 9999;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Modal Card */
    .modal-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      width: 100%;
      max-width: 600px;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      transform: scale(0.8) translateY(20px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    /* Close Button */
    .btn-edit {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-edit:hover { background: #4f46e5; }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.05);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-color);
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    /* Modal Content */
    .modal-header h2 {
      margin: 0 0 8px 0;
      color: var(--text-color);
    }

    .modal-header p {
      margin: 0 0 24px 0;
      color: #64748b;
      font-size: 0.9rem;
    }

    /* Input Fields */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .input-group input:focus { border-color: #6366f1; }

    .btn-save {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .input-group i {
      position: absolute;
      left: 16px;
      top: 47%;
      transform: translateY(-50%);
      color: #94a3b8;
      transition: color 0.3s;
    }

    .input-group textarea {
      width: 100%;
      padding: 10px 16px 50px 48px;
      box-sizing: border-box;
      border: 2px solid rgba(226, 232, 240, 0.8);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      box-sizing: border-box;
      border: 2px solid rgba(226, 232, 240, 0.8);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .input-group input:focus + i {
      color: #6366f1;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--primary-gradient);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.95;
    }

    /* Status Toast Alert */
    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
